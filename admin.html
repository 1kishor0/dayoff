<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Admin – Day-Off Submissions</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Nordlich Consulting GmbH</h1>
    <p>Admin – Day-Off Submissions</p>
  </header>

  <main id="login-wrap">
    <section class="card">
      <h2>Admin login</h2>
      <label for="password">Password</label>
      <input type="password" id="password">
      <button id="btn-login">Log in</button>
      <div id="login-msg" class="msg hidden"></div>
    </section>
  </main>

  <main id="panel" class="wide hidden">
    <section class="card">
      <div class="toolbar">
        <div>
          <label for="f-week">Week starting</label>
          <select id="f-week"></select>
        </div>
        <div>
          <label for="f-wh">Warehouse</label>
          <select id="f-wh"></select>
        </div>
        <button id="btn-refresh" class="secondary">Refresh</button>
        <button id="btn-excel">Download Excel</button>
      </div>
      <p class="count" id="count"></p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Submitted</th><th>Week start</th><th>Warehouse</th><th>Employee ID</th>
              <th>Days off</th><th>Weekdays</th><th>Reason</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer><a href="index.html">Back to employee page</a></footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
